[package]
name    = "ramwarden-ui"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description = "RamWarden's task manager: a GTK4 window over the daemon's API."

[lib]
name = "ramwarden_ui"
path = "src/lib.rs"

[[bin]]
name = "ramwarden"
path = "src/main.rs"
required-features = ["gui"]

[features]
# The GUI needs GTK4 development headers. Without them the crate still builds as
# a library, so the client and the row model stay testable on a headless box.
default = []
gui = ["dep:gtk4"]
# The Windows window: egui plus a tray icon.
tray = ["dep:eframe", "dep:tray-icon", "dep:windows", "dep:winit"]

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
reqwest    = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror  = { workspace = true }
tempfile = { workspace = true }
gtk4       = { workspace = true, optional = true }
eframe     = { version = "0.36", optional = true, default-features = false, features = ["glow", "default_fonts", "accesskit"] }
windows    = { workspace = true, optional = true, features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Media_Audio", "Win32_Media_Multimedia"] }
winit = { version = "0.30", optional = true, default-features = false }
tray-icon  = { version = "0.26", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "ramwarden-tray"
path = "src/tray_main.rs"
required-features = ["tray"]



[[example]]
name = "inspect"
required-features = ["gui"]

[[example]]
name = "live_display"
required-features = ["gui"]

[[example]]
name = "companions_preview"
required-features = ["tray"]

[[example]]
name = "speech_smoke"
required-features = ["tray"]
