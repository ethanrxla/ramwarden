[package]
name    = "ramwarden-core"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description = "RamWarden policy: activity detection, the reclaim gate, and the remediation ladder."

[dependencies]
ramwarden-platform = { path = "../ramwarden-platform" }
thiserror = { workspace = true }
tracing   = { workspace = true }
serde     = { workspace = true }
serde_json = { workspace = true }
toml      = { workspace = true }
rusqlite  = { workspace = true }

# Linux-only modules (terminals, private) and the `Detector::linux` /
# `Actuator::linux` conveniences read the kernel crate directly.
[target.'cfg(target_os = "linux")'.dependencies]
ramwarden-kernel = { path = "../ramwarden-kernel" }
libc      = { workspace = true }

[target.'cfg(windows)'.dependencies]
ramwarden-nt = { path = "../ramwarden-nt" }

[dev-dependencies]
tempfile = { workspace = true }
