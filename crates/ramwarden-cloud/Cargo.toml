[package]
name    = "ramwarden-cloud"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description = "Hosted accounts, subscriptions, and opt-in decision-log storage on MongoDB Atlas."

[dependencies]
# The local decision log (decisions.rs, History) that `decisions sync` reads.
ramwarden-core = { path = "../ramwarden-core" }
reqwest    = { workspace = true }
mongodb    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
toml       = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror  = { workspace = true }
futures    = { workspace = true }
sha2       = { workspace = true }
dotenvy    = { workspace = true }
rand       = { workspace = true }
async-trait = "0.1"
sha3       = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
