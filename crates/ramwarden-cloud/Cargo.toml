[package]
name    = "ramwarden-cloud"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description = "RamWarden Cloud: MongoDB Atlas storage for accounts, wallets, devices, passes, payments and usage, and the decision-log sync with vector search."

[dependencies]
# The local decision log (decisions.rs, History) that `decisions sync` reads.
ramwarden-core = { path = "../ramwarden-core" }
reqwest    = { workspace = true }
mongodb    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
toml       = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror  = { workspace = true }
futures    = { workspace = true }
sha2       = { workspace = true }
dotenvy    = { workspace = true }
rand       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
