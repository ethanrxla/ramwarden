[package]
name    = "ramwarden-kernel"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description = "Linux kernel memory primitives for RamWarden: cgroup v2 reclaim, PSI, PSS, pidfd, zram."

# Linux only. On any other target the crate compiles to nothing, so the
# workspace still builds there.
[target.'cfg(target_os = "linux")'.dependencies]
ramwarden-platform = { path = "../ramwarden-platform" }
thiserror  = { workspace = true }
tracing    = { workspace = true }
serde_json = { workspace = true }
nix        = { workspace = true, features = ["process", "signal", "poll", "fs"] }
libc       = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = { workspace = true }
