[package]
name    = "ramwarden-daemon"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description = "The RamWarden daemon: the :7823 API, and the loop that drives the ladder."

[lib]
name = "ramwarden_daemon"
path = "src/lib.rs"

[[bin]]
name = "ramwarden-daemon"
path = "src/main.rs"

[dependencies]
ramwarden-kernel = { path = "../ramwarden-kernel" }
ramwarden-core   = { path = "../ramwarden-core" }
ramwarden-ai     = { path = "../ramwarden-ai" }
axum       = { workspace = true }
tokio      = { workspace = true }
tower-http = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
futures    = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
uuid       = { workspace = true }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tempfile = { workspace = true }
