<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RamWarden</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      background: #0f172a;
      color: #e2e8f0;
    }
    header {
      padding: 12px 16px;
      background: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 14px; font-weight: 600; flex: 1; }
    #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    #status-dot.connected { background: #22c55e; }

    .ram-bar-wrap { padding: 12px 16px 8px; }
    .ram-label {
      display: flex; justify-content: space-between;
      margin-bottom: 4px; font-size: 12px; color: #94a3b8;
    }
    .ram-bar { height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
    .ram-bar-fill { height: 100%; background: #22c55e; border-radius: 3px; transition: width 0.4s ease; }
    .ram-bar-fill.warn { background: #f59e0b; }
    .ram-bar-fill.danger { background: #ef4444; }

    .section { padding: 8px 16px; }
    .section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: #64748b; margin-bottom: 6px;
    }
    .tab-count { color: #94a3b8; font-size: 12px; }

    button.action {
      display: block; width: calc(100% - 32px); margin: 8px 16px;
      padding: 7px 12px; background: #3b82f6; color: #fff; border: none;
      border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500;
    }
    button.action:hover { background: #2563eb; }
    button.action:disabled { background: #334155; color: #64748b; cursor: default; }

    #history-list { max-height: 160px; overflow-y: auto; }
    .history-item {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 0; border-bottom: 1px solid #1e293b;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item a {
      color: #93c5fd; text-decoration: none; flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .history-item a:hover { text-decoration: underline; }
    .history-time { color: #475569; font-size: 11px; white-space: nowrap; }

    .daemon-row {
      padding: 6px 16px; border-top: 1px solid #1e293b;
      display: flex; gap: 6px; align-items: center;
    }
    .daemon-row span { font-size: 11px; color: #475569; white-space: nowrap; }
    .daemon-row input {
      flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 4px;
      padding: 3px 6px; color: #e2e8f0; font-size: 11px;
    }
    .daemon-row button {
      padding: 3px 8px; background: #1e293b; border: 1px solid #334155;
      border-radius: 4px; color: #e2e8f0; font-size: 11px; cursor: pointer;
    }
    footer {
      padding: 7px 16px; color: #475569; font-size: 11px;
      border-top: 1px solid #1e293b; text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div id="status-dot"></div>
    <h1>RamWarden</h1>
    <span id="ram-pct" style="font-size:12px;color:#94a3b8">—</span>
  </header>

  <div class="ram-bar-wrap">
    <div class="ram-label">
      <span>RAM Usage</span>
      <span id="ram-used">—</span>
    </div>
    <div class="ram-bar"><div class="ram-bar-fill" id="ram-fill" style="width:0%"></div></div>
  </div>

  <div class="section">
    <div class="section-title">Memory Breakdown</div>
    <div id="ram-breakdown" style="font-size:12px;line-height:1.7;color:#94a3b8">Loading…</div>
  </div>

  <div class="section">
    <div class="section-title">Open Tabs</div>
    <div class="tab-count" id="tab-count">Loading…</div>
  </div>

  <button class="action" id="analyze-btn">Analyze Now</button>
  <div id="analysis-result" style="padding:0 10px 10px;color:#94a3b8;font-size:12px" aria-live="polite"></div>

  <div class="section">
    <div class="section-title">Recently Closed</div>
    <div id="history-list"><span style="color:#475569">Loading…</span></div>
  </div>

  <div class="daemon-row">
    <span>Daemon</span>
    <input type="text" id="daemon-host-input" placeholder="localhost:7823" />
    <button onclick="saveDaemonHost()">Save</button>
  </div>
  <div id="daemon-host-status" style="color:#f59e0b;font-size:11px;padding:0 10px 6px"></div>

  <footer>RamWarden · <span id="browsers-connected">—</span> browser(s) connected</footer>

  <script src="popup.js"></script>
</body>
</html>
