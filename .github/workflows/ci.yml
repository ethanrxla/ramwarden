name: CI

on:
  push:
    branches: [main, mac, windows, linux]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_crate: crates/ramwarden-kernel
          - os: windows-latest
            platform_crate: crates/ramwarden-nt
          - os: macos-latest
            platform_crate: crates/ramwarden-mac
    steps:
      - uses: actions/checkout@v4
      # A platform is built only once its crate exists on the branch, so a
      # branch without Windows or macOS support skips those jobs instead of
      # failing. Once the crate lands the job runs and must pass.
      - name: Platform supported on this branch?
        id: platform
        shell: bash
        run: |
          if [ -f "${{ matrix.platform_crate }}/Cargo.toml" ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.platform_crate }} is not on this branch; skipping ${{ matrix.os }}."
            echo "supported=false" >> "$GITHUB_OUTPUT"
          fi
      # Pinned so a new Rust release can't turn main red with new lints.
      # Bump it on purpose, in its own PR, and fix what clippy finds.
      - uses: dtolnay/rust-toolchain@master
        if: steps.platform.outputs.supported == 'true'
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.platform.outputs.supported == 'true'
      - name: Linux GUI dependencies
        if: runner.os == 'Linux' && steps.platform.outputs.supported == 'true'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - name: Format
        if: steps.platform.outputs.supported == 'true'
        # Advisory until one repo-wide `cargo fmt` commit lands after the
        # branch reconcile; formatting now would conflict with every open PR.
        continue-on-error: true
        run: cargo fmt --all --check
      - name: Clippy
        if: steps.platform.outputs.supported == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: steps.platform.outputs.supported == 'true'
        run: cargo test --workspace
      - name: Mac checklist and app build
        if: runner.os == 'macOS'
        run: |
          swiftc -parse-as-library -target "$(uname -m)-apple-macosx13.0" macos/menubar/Companion.swift macos/menubar/WardenCompanion.swift macos/menubar/Voice.swift macos/menubar/Speech.swift macos/menubar/PetSizing.swift macos/menubar/tests/review.swift -o "$RUNNER_TEMP/review-test"
          "$RUNNER_TEMP/review-test"
          RAMWARDEN_APP_DEST="$RUNNER_TEMP/RamWarden.app" bash macos/menubar/build.sh
          swiftc -O macos/menubar/PetSizing.swift macos/menubar/tests/PetSizingTests.swift -o "$RUNNER_TEMP/pet-sizing-test"
          "$RUNNER_TEMP/pet-sizing-test"
          RAMWARDEN_SETUP_DEST="$RUNNER_TEMP/RamWarden Setup.app" bash macos/setup/build.sh

  # The website in web/: plain HTML, CSS and ES modules with no build step.
  # Unit tests need only Node; the browser tests drive Chromium against the
  # mock server and injected fake wallets.
  web:
    name: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test web/tests/*.test.mjs
      - name: Extension tests
        run: node --test extension/tests/discard.cjs extension/tests/warden.cjs
      - name: Browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
          node web/tests/e2e.cjs
      - name: Extension activity and closure guards
        run: |
          node --test extension/tests/discard.cjs
          node extension/tests/live.cjs

  # The checkout contract in contracts/. Hardhat compiles with the solc-js build
  # pinned in contracts/package.json and runs the tests on its in-process chain.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat test
