name: Release

# Push a tag `v<version>` matching [workspace.package].version to publish:
#   git tag v0.3.0 && git push origin v0.3.0
# A tag with a hyphen (v0.3.0-beta.1) publishes a prerelease, which
# `releases/latest` (and so every installed launcher) ignores.
#
# Every secret is optional. Without one, the matching step is skipped and the
# release still builds; see docs/specs/updates.md for what each unlocks.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        shell: bash
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "v$version" != "${TAG%%-*}" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    needs: version
    runs-on: macos-latest
    env:
      # Secrets cannot appear in `if:`; this flag can.
      HAS_CERT: ${{ secrets.MACOS_APP_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: Import Developer ID certificates
        env:
          APP_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APP_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        if: env.HAS_CERT == 'true'
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          for p in "$APP_P12" "$INSTALLER_P12"; do
            [ -n "$p" ] || continue
            echo "$p" | base64 --decode > "$RUNNER_TEMP/c.p12"
            security import "$RUNNER_TEMP/c.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          done
          rm -f "$RUNNER_TEMP/c.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGN_IDENTITY=$APP_ID" >> "$GITHUB_ENV"
          [ -n "$INSTALLER_ID" ] && echo "MACOS_INSTALLER_IDENTITY=$INSTALLER_ID" >> "$GITHUB_ENV"
      - run: scripts/package-macos.sh
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Code-signing certificate
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        if: env.HAS_CERT == 'true'
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          "WINDOWS_CERT_PFX=$path" >> $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  publish:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: Manifest
        shell: bash
        env:
          RAMWARDEN_SIGNING_KEY: ${{ secrets.RAMWARDEN_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cargo build --release -p ramwarden-launcher
          L=target/release/ramwarden-launcher
          if [ -z "$RAMWARDEN_SIGNING_KEY" ]; then
            echo "::warning::RAMWARDEN_SIGNING_KEY is not set: publishing installers without a manifest, so installed launchers will not see this release."
            exit 0
          fi
          # Carry the other wardens (Wazuh, …) and the sequence over from the
          # current manifest. Only "no manifest published yet" starts again at
          # 1: a failed download must fail the job, because a reset sequence
          # is one every installed launcher refuses as a replay.
          if gh release view --repo "$REPO" --json assets -q '.assets[].name' 2>/dev/null | grep -qx manifest.json; then
            gh release download --repo "$REPO" --pattern manifest.json --output previous.json
          fi
          $L release manifest --warden ram --name "RAM Warden" --tier free --version "$VERSION" \
            --summary "Watches memory pressure and reclaims memory cheapest-first." \
            --health http://127.0.0.1:7823/health \
            --dist dist --base-url "https://github.com/$REPO/releases/download/$TAG" \
            --previous previous.json --published-at "$(date -u +%FT%TZ)" --out dist/manifest.json
          $L release sign dist/manifest.json
          # Fails if the key that signed it is not one this build ships, which
          # would leave every installed launcher unable to read it.
          $L release verify dist/manifest.json
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --title "RamWarden $TAG" --generate-notes "${flags[@]}" \
            || gh release upload "$TAG" dist/* --clobber
